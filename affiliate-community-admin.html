<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eCuisine Affiliate Verification</title><style>body{font:16px/1.5 system-ui;background:#f7f7f1;color:#1e2c24;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}h1,h2{color:#183c2d}.card{background:white;border:1px solid #dfe7df;border-radius:15px;padding:20px;margin:18px 0}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #cbd7cd}button{cursor:pointer;background:#183c2d;color:white;font-weight:700;margin:3px}.secondary{background:#e8f1e9;color:#183c2d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #e3e8e3}small,.muted{color:#66736a}#loginForm{display:flex;gap:8px;flex-wrap:wrap}#loginForm input{flex:1;min-width:180px}</style></head><body><main class="wrap"><h1>Affiliate group join verification</h1><p class="muted">Check the WhatsApp group member list before approving a request. Only verified requests count publicly.</p><section class="card" id="login"><h2>Owner sign in</h2><form id="loginForm"><input id="email" type="email" required placeholder="Owner email"><input id="password" type="password" required placeholder="Password"><button>Sign in</button></form><p id="msg" class="muted"></p></section><section class="card" id="panel" hidden><button id="refresh">Refresh requests</button><button id="out">Sign out</button><p id="summary" class="muted"></p><div id="rows"></div></section></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const KEY="sb_publishable_iTpErW44DA3l6Sz22MSgAw_fQ4xaQKC",URL="https://zsepwkequzwwuxtrpmmy.supabase.co",API=URL+"/functions/v1/affiliate-community",sb=createClient(URL,KEY),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(action,extra={}){const{data:{session}}=await sb.auth.getSession();const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+(session?.access_token||"")},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("msg").textContent="Signing in…";const{error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("msg").textContent=error.message;return}await load()});
async function load(){try{const d=await call("admin_list");$("login").hidden=true;$("panel").hidden=false;$("summary").textContent=(d.requests||[]).length+" requests. Verify only after confirming membership in the WhatsApp group.";const rows=d.requests||[];$("rows").innerHTML=rows.length?'<div style="overflow:auto"><table><thead><tr><th>Recruit</th><th>WhatsApp</th><th>Invited by</th><th>Date</th><th>Status</th><th>Review</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.recruit_name)+'</td><td>'+esc(x.recruit_whatsapp)+'</td><td>'+esc(x.affiliate_profiles?.display_name||"Affiliate")+' ('+esc(x.affiliate_profiles?.referral_code||"") +')</td><td>'+esc(new Date(x.submitted_at).toLocaleDateString())+'</td><td>'+esc(x.status)+'</td><td><button data-id="'+esc(x.id)+'" data-status="verified">Verify</button><button class="secondary" data-id="'+esc(x.id)+'" data-status="rejected">Reject</button></td></tr>').join("")+'</tbody></table></div>':"No requests yet."}catch(e){$("login").hidden=false;$("panel").hidden=true;$("msg").textContent=e.message}}
$("rows").addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;if(b.dataset.status==="verified"&&!confirm("Have you confirmed this person is in the WhatsApp group?"))return;try{await call("admin_review",{id:b.dataset.id,status:b.dataset.status});await load()}catch(err){alert(err.message)}});
$("refresh").onclick=load;$("out").onclick=async()=>{await sb.auth.signOut();$("panel").hidden=true;$("login").hidden=false};sb.auth.getSession().then(({data})=>{if(data.session)load()});
</script></body></html>
