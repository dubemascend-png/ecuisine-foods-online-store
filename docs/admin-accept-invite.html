<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#183c2d">
<title>Set up admin access | eCuisine Foods</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="emoji-3d.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.admin-setup-wrap{max-width:560px;margin:5vh auto;padding:20px}.admin-setup-card{background:#fff;border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 40px #183c2d18}.admin-setup-card h1{margin:.35em 0}.admin-setup-card p{line-height:1.6}.admin-setup-card label{display:block;font-weight:600;margin:16px 0 7px}.admin-setup-card input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd5cf;border-radius:10px;font:inherit}.admin-setup-card button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#183c2d;color:#fff;font:inherit;font-weight:700;cursor:pointer}.admin-setup-card button:disabled{opacity:.6;cursor:wait}#status{min-height:1.5em;overflow-wrap:anywhere}.admin-setup-card a{color:#183c2d;font-weight:600}
</style><link rel="stylesheet" href="theme.css?v=20261021"><script defer src="theme.js?v=20261021"></script></head>
<body>
<header><a class="brand" href="index.html">eCuisine <small>FOODS</small></a></header>
<main class="admin-setup-wrap"><section class="admin-setup-card">
<p class="eyebrow">TEAM ACCESS</p><h1>Set up or reset your password</h1>
<p>Use this secure email link to create or reset the password for your eCuisine owner or team account. This is separate from affiliate sign-in.</p>
<form id="setupForm">
<label for="email">Invited email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="password">Create password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
<label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password">
<button id="save" type="submit" disabled>Set password and continue</button>
</form><p id="status" role="status" aria-live="polite">Checking your invitation…</p>
<p>Already set up? <a href="admin.html">Go to admin sign-in</a></p>
</section></main>
<script>
(() => {
 const sb=window.supabase.createClient("https://zsepwkequzwwuxtrpmmy.supabase.co","sb_publishable_iTpErW44DA3l6Sz22MSgAw_fQ4xaQKC",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
 const form=document.getElementById("setupForm"),email=document.getElementById("email"),password=document.getElementById("password"),confirm=document.getElementById("confirm"),save=document.getElementById("save"),status=document.getElementById("status");
 let ready=false;
 async function checkInvite(){
   try {
     const code=new URLSearchParams(location.search).get("code");\n     if(code){const exchanged=await sb.auth.exchangeCodeForSession(code);if(exchanged.error)throw exchanged.error;history.replaceState({},document.title,location.pathname);}\n     const {data,error}=await sb.auth.getSession(); if(error) throw error;
     if(data.session?.user){email.value=data.session.user.email||"";email.readOnly=true;ready=true;save.disabled=false;status.textContent="Invitation verified. Create your password below.";return;}
     status.textContent="No active invitation was found. Open the latest invitation email on this device, or ask the owner to send a new invitation.";
   } catch(e){status.textContent=e?.message||"Could not verify this invitation. Please open the latest invitation email again.";}
 }
 form.addEventListener("submit",async e=>{
   e.preventDefault();if(!ready)return;
   if(password.value.length<8){status.textContent="Use a password with at least 8 characters.";return;}
   if(password.value!==confirm.value){status.textContent="The passwords do not match.";return;}
   save.disabled=true;status.textContent="Saving your password…";
   try{
     const {data,error}=await sb.auth.updateUser({password:password.value});if(error)throw error;
     if(!data.user)throw new Error("Password was not confirmed. Please try again.");
     status.textContent="Password saved. Opening the admin dashboard…";
     location.replace(new URL("admin.html",location.href).href);
   }catch(err){status.textContent=err?.message||"Unable to set password. Request a fresh invitation if this link has expired.";save.disabled=false;}
 });
 checkInvite();
})();
</script><script src="emoji-3d.js" defer></script></body></html>
