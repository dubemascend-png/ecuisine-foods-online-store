<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#183c2d"><title>Affiliate Support Chat | eCuisine Foods</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="emoji-3d.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.chat-wrap{max-width:920px;margin:24px auto;padding:16px}.chat-card{background:#fffdf7;border:1px solid #e5e0d4;border-radius:16px;padding:20px}.chat-grid{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:16px}.chat-list{display:flex;flex-direction:column;gap:8px}.thread{padding:12px;border:1px solid #e5e0d4;border-radius:10px;background:#fff;text-align:left;color:#183c2d;cursor:pointer}.thread.active{background:#e9efe8;border-color:#183c2d}.chat-messages{height:52vh;min-height:300px;overflow:auto;border:1px solid #e5e0d4;border-radius:10px;padding:12px;background:#faf8f1;display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;padding:10px 13px;border-radius:12px;background:#e9efe8;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#183c2d;color:white;align-self:flex-end}.bubble small{display:block;opacity:.7;font-size:.7rem;margin-top:5px}.sendrow{display:flex;gap:8px;margin-top:10px}.sendrow textarea{flex:1;resize:vertical;min-height:48px;border:1px solid #ccd8cb;border-radius:10px;padding:12px;font:inherit}.sendrow button{min-width:90px}@media(max-width:640px){.chat-grid{grid-template-columns:1fr}.chat-messages{height:42vh}.chat-list{max-height:160px;overflow:auto}}
</style></head><body><header><a class="brand" href="index.html">eCuisine <small>FOODS</small></a><nav><a href="affiliate.html">Affiliate dashboard</a> · <a href="admin.html">Admin dashboard</a></nav></header><main class="chat-wrap"><section class="chat-card"><p class="eyebrow">ECUISINE SUPPORT</p><h1>Affiliate and Admin Chat</h1><p id="status" role="status">Checking your account…</p><div class="chat-grid"><aside><h2 id="listTitle">Conversations</h2><div id="threads" class="chat-list"></div></aside><section><h2 id="threadTitle">Choose a conversation</h2><div id="messages" class="chat-messages" aria-live="polite"></div><form id="sendForm" class="sendrow"><textarea id="message" maxlength="2000" required placeholder="Write a message…"></textarea><button id="send" type="submit">Send</button></form><button id="refresh" class="secondary" type="button" style="margin-top:10px">Refresh messages</button></section></div></section></main>
<script>
(()=>{const U="https://zsepwkequzwwuxtrpmmy.supabase.co",K="sb_publishable_iTpErW44DA3l6Sz22MSgAw_fQ4xaQKC",sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);let session=null,isAdmin=false,threads=[],active=null;
async function api(body){const r=await fetch(U+"/functions/v1/ecuisine-chat",{method:"POST",headers:{"Content-Type":"application/json","apikey":K,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"Chat request failed");return d}
function say(t){$("status").textContent=t}
async function loadThreads(){const d=await api({action:"threads"});threads=d.threads||[];$("threads").replaceChildren();threads.forEach(t=>{const b=document.createElement("button");b.className="thread"+(active===t.affiliate_id?" active":"");b.textContent=(t.display_name||"Affiliate")+" · "+String(t.status||"active");b.onclick=()=>openThread(t.affiliate_id,t.display_name);$("threads").appendChild(b)});if(!threads.length)say(isAdmin?"No affiliate conversations yet.":"Your support conversation is ready.");if(!active&&threads.length)await openThread(threads[0].affiliate_id,threads[0].display_name)}
async function openThread(id,name){active=id;$("threadTitle").textContent=name||"Affiliate conversation";document.querySelectorAll(".thread").forEach((b,i)=>b.classList.toggle("active",threads[i]?.affiliate_id===id));await loadMessages()}
async function loadMessages(){if(!active)return;const d=await api({action:"messages",affiliate_id:active});const box=$("messages");box.replaceChildren();(d.messages||[]).forEach(m=>{const b=document.createElement("div");b.className="bubble"+(m.sender_user_id===session.user.id?" mine":"");b.textContent=m.message;const small=document.createElement("small");small.textContent=(m.sender_role==="admin"?"eCuisine Admin":"Affiliate")+" · "+new Date(m.created_at).toLocaleString();b.appendChild(small);box.appendChild(b)});box.scrollTop=box.scrollHeight}
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();const text=$("message").value.trim();if(!text||!active)return;$("send").disabled=true;try{await api({action:"send",affiliate_id:active,message:text});$("message").value="";await loadMessages();say("Message sent.")}catch(err){say(err.message)}finally{$("send").disabled=false}});
$("refresh").onclick=async()=>{try{await loadThreads();if(active)await loadMessages();say("Chat refreshed.")}catch(e){say(e.message)}};
(async()=>{const {data,error}=await sb.auth.getSession();session=data.session;if(error||!session){say("Please sign in first, then reopen chat.");return}try{const d=await api({action:"threads"});threads=d.threads||[];isAdmin=!!d.is_admin;$("listTitle").textContent=isAdmin?"Affiliate conversations":"Your support chat";$("threads").replaceChildren();threads.forEach(t=>{const b=document.createElement("button");b.className="thread";b.textContent=(t.display_name||"Affiliate")+" · "+String(t.status||"active");b.onclick=()=>openThread(t.affiliate_id,t.display_name);$("threads").appendChild(b)});if(!isAdmin&&threads.length===0){say("Your account is not registered as an affiliate or an authorised support admin.");return}if(threads.length)await openThread(threads[0].affiliate_id,threads[0].display_name);say("Chat ready. Refresh to check for new messages.")}catch(e){say(e.message)}})();
})();
</script><script src="emoji-3d.js" defer></script></body></html>
