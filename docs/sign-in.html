<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183c2d"><title>Sign in | eCuisine Foods</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header><a class="brand" href="index.html">eCuisine <small>FOODS</small></a><nav><a href="affiliate.html">Affiliate programme</a><a href="sign-up.html">Create account</a><a href="index.html">Store</a></nav></header>
<main class="account-main"><section class="account-card"><p class="eyebrow">WELCOME BACK</p><h1>Welcome to <em>eCuisine.</em></h1><p>Sign in to open your affiliate dashboard and access your unique referral link.</p>
<form id="f" class="account-form"><label for="e">Email</label><input id="e" type="email" required autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><button id="submit" class="btn dark">Sign in</button></form><p id="msg" role="status" aria-live="polite"></p><p>New here? <a href="sign-up.html">Create an account</a>.</p></section></main>
<script>
const sb=window.supabase.createClient("https://zsepwkequzwwuxtrpmmy.supabase.co","sb_publishable_iTpErW44DA3l6Sz22MSgAw_fQ4xaQKC",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("f"),msg=document.getElementById("msg"),submit=document.getElementById("submit");
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;msg.textContent="Signing you in…";try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("e").value.trim().toLowerCase(),password:document.getElementById("pw").value});if(error)throw error;if(!data.session)throw new Error("No session was created. Please try again.");msg.textContent="Signed in. Opening your affiliate dashboard…";location.href="affiliate.html";}catch(error){msg.textContent=error?.message||"Unable to sign in. Please try again.";submit.disabled=false;}});
</script></body></html>
