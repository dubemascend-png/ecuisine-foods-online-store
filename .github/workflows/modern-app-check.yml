name: Modern app build check

on:
  push:
    branches:
      - main
      - feature/react-tailwind-foundation
    paths:
      - "modern-app/**"
      - ".github/workflows/modern-app-check.yml"
  pull_request:
    paths:
      - "modern-app/**"
      - ".github/workflows/modern-app-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
